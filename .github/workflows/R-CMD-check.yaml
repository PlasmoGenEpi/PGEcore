# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
#
# Runs R CMD check on PRs and pushes. Optional Suggests (moire, dcifer, etc.)
# are not required for a green check; tests use skip_if_not_installed().
# Extra repos pull PlasmoGenEpi and Bioconductor packages when available.

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # Compiled McCOIL code: cover Linux + macOS. Keep the matrix small.
          - { os: ubuntu-latest, r: "release" }
          - { os: macos-latest, r: "release" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Do not fail R CMD check when Suggests are missing from CRAN/Bioc.
      _R_CHECK_FORCE_SUGGESTS_: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          extra-repositories: |
            https://plasmogenepi.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
